name: CI
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: test ${{ matrix.os }} node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Includes isolated install, uninstall, peer-preservation and hook tests.
      - run: npm test
      - run: node bin/laconia.mjs lint README.md --format document
      - run: node bin/laconia.mjs lint skills/laconia/SKILL.md --format document
      - run: node bin/laconia.mjs lint output-styles/laconia.md --format document
      - run: npm pack --dry-run --json
